<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futuristic Glass Dashboard</title>
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- خلفيات الإضاءة النيون لإبراز الزجاج -->
  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <!-- شريط التحميل الاحترافي أعلى الصفحة -->
  <div class="page-loader-bar" id="loaderBar"></div>

  <!-- المحتوى الرئيسي -->
<main class="main-content">
  <!-- شريط البحث السحري المدمج -->
  <div class="top-header" id="topHeader">
    <div class="expand-search-wrapper" id="searchWrapper">
      <div class="neon-search-box">
        <i class="fa-solid fa-magnifying-glass search-icon-inside"></i>
        <input type="text" id="searchInput" placeholder="ابحث عن أي موقع أو تقنية..." oninput="filterDashboard()">
        <button class="close-search-btn" aria-label="إغلاق البحث" onclick="toggleSearch(false)">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="dashboard-grid" id="gridContainer">
    <!-- الأقسام بتنزل هنا -->
  </div>
</main>

<!-- دائرة الصورة العائمة مع أيقونة التعديل في الـ Hover -->
<div class="bottom-profile-avatar" role="button" tabindex="0" aria-label="تغيير الصورة الشخصية" title="تغيير الصورة الشخصية" onclick="document.getElementById('profileInput').click()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('profileInput').click();}">
  <img src="https://ui-avatars.com/api/?name=User&background=a855f7&color=fff&bold=true" alt="User Profile" id="profileImg">
  <div class="avatar-edit-overlay">
    <i class="fa-solid fa-camera"></i>
  </div>
  <input type="file" id="profileInput" accept="image/*" style="display: none;" onchange="uploadProfileImage(event)">
</div>
<!-- ودجت الساعة والتاريخ -->
<div class="bottom-time-widget">
  <div class="time-display" id="clockTime">00:00:00</div>
  <div class="date-display" id="clockDate">جاري التحميل...</div>
</div>

  <!-- Floating Navigation Bar -->
  <div class="bottom-nav-container">
    <nav class="bottom-nav">
      <button class="nav-item active" title="الرئيسية" aria-label="الرئيسية" onclick="resetSearch()">
        <i class="fa-solid fa-house"></i>
      </button>
      <button class="nav-item" id="searchToggleBtn" title="بحث" aria-label="بحث">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <button class="nav-item" id="openSectionModal" title="إضافة سكشن" aria-label="إضافة سكشن جديد">
        <i class="fa-solid fa-plus"></i>
      </button>
      <button class="nav-item" id="openLinkModal" title="إضافة محتوى" aria-label="إضافة محتوى جديد">
        <i class="fa-solid fa-link"></i>
      </button>
      <button class="nav-item" id="themeBtn" title="المظهر" aria-label="تبديل المظهر الداكن والفاتح">
        <i class="fa-solid fa-moon"></i>
      </button>
      <button class="nav-item" id="openSettingsModal" title="نسخة احتياطية" aria-label="نسخة احتياطية للبيانات">
        <i class="fa-solid fa-gear"></i>
      </button>
    </nav>
  </div>

  <!-- Modal إضافة سكشن -->
  <div class="modal-overlay" id="sectionModal">
    <div class="modal glass-card">
      <h3 id="sectionModalTitle"><i class="fa-solid fa-folder-plus"></i> إضافة سكشن جديد</h3>
      <div class="form-group">
        <label>عنوان السكشن</label>
        <input type="text" id="secTitle" placeholder="مثال: مسار Front-End أو أدوات التصميم">
      </div>
      <div class="form-group" id="secTypeGroup">
        <label>نوع السكشن</label>
        <div class="custom-shopify-select">
          <select id="secType">
            <option value="normal">🌐 سكشن عادي (روابط ومواقع)</option>
            <option value="learning">🎓 سكشن تعليمي (مسار / آكورديون)</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveSectionBtn">حفظ السكشن</button>
        <button class="btn btn-secondary closeModal">إلغاء</button>
      </div>
      <div class="preset-buttons" id="sectionPresets">
        <p style="margin-bottom: 8px; font-size: 0.9rem; color: #aaa;">أو أضف قسم جاهز بنقرة واحدة:</p>
        <button type="button" class="btn-preset" onclick="addPresetSection('ai')">🤖 أدوات الذكاء الاصطناعي</button>
        <button type="button" class="btn-preset" onclick="addPresetSection('freelance')">💼 Freelance</button>
        <button type="button" class="btn-preset" onclick="addPresetSection('chat')">💬 الشات والتواصل</button>
        <button type="button" class="btn-preset" onclick="addPresetSection('media')">🎬 الميديا والصناع</button>
      </div>
    </div>
  </div>


  <!-- Modal إضافة / تعديل محتوى -->
  <div class="modal-overlay" id="linkModal">
    <div class="modal glass-card modal-lg">
      <h3 id="linkModalTitle"><i class="fa-solid fa-circle-plus"></i> إضافة محتوى للسكشن</h3>
      
      <div class="form-group" id="targetSecGroup">
        <label>اختر السكشن</label>
        <div class="custom-shopify-select">
          <select id="targetSecSelect"></select>
        </div>
      </div>

      <div id="normalFields">
        <div class="form-group">
          <label>اسم الموقع/الرابط <span class="required-star">*</span></label>
          <input type="text" id="linkName" placeholder="مثال: Facebook">
        </div>
        <div class="form-group">
          <label>رابط الموقع (URL) <span class="required-star">*</span></label>
          <input type="url" id="linkUrl" placeholder="https://example.com">
        </div>
      </div>

      <div id="learningFields" class="hidden">
        <div class="form-group">
          <label>اسم التقنية/الموضوع <span class="required-star">*</span></label>
          <input type="text" id="topicName" placeholder="مثال: HTML5 أو JavaScript">
        </div>
        <div class="form-group">
          <label>رابط الكورس</label>
          <input type="url" id="topicCourse" placeholder="https://youtube.com/...">
        </div>
        <div class="form-group">
          <label>ملاحظات ملخصة</label>
          <textarea id="topicNotes" rows="3" placeholder="اكتب الملاحظات الهامة هنا..."></textarea>
        </div>
        <div class="form-group">
          <label>رابط ملف الـ PDF / المراجع</label>
          <input type="url" id="topicPdf" placeholder="https://drive.google.com/...">
        </div>
      </div>

      <!-- معرض الأيقونات الجاهزة والمقسمة -->
      <div class="form-group">
        <label>اختر أيقونة من المعرض أو ارفع أيقونة خاصة</label>
        <div class="icon-picker-tabs">
          <button type="button" class="icon-tab active" data-category="social" onclick="switchIconTab('social', event)">سوشيال</button>
          <button type="button" class="icon-tab" data-category="tools" onclick="switchIconTab('tools', event)">أدوات وبرمجة</button>
          <button type="button" class="icon-tab" data-category="business" onclick="switchIconTab('business', event)">أعمال</button>
          <button type="button" class="icon-tab" data-category="general" onclick="switchIconTab('general', event)">عام</button>
        </div>
        
        <div class="icon-picker-grid" id="iconPickerGrid">
          <!-- الأيقونات بتنزل هنا بالـ JS -->
        </div>

        <div class="custom-icon-upload">
          <label for="iconFile" class="file-upload-label">
            <i class="fa-solid fa-cloud-arrow-up"></i> رفع أيقونة من الجهاز
          </label>
          <input type="file" id="iconFile" accept="image/*" onchange="handleIconFileUpload(event)">
          <span id="fileNameDisplay" class="file-name-span"></span>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-primary" id="saveLinkBtn">حفظ المحتوى</button>
        <button class="btn btn-secondary closeModal">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Modal النسخة الاحتياطية -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal glass-card modal-sm">
      <h3><i class="fa-solid fa-gear"></i> النسخة الاحتياطية</h3>
      <p class="settings-hint">احتفظ بنسخة من بياناتك عشان تقدر تنقلها لجهاز تاني أو ترجعها لو حصل أي حاجة.</p>
      <div class="modal-actions modal-actions-stacked">
        <button class="btn btn-primary" id="exportDataBtn">
          <i class="fa-solid fa-cloud-arrow-down"></i> تحميل نسخة احتياطية
        </button>
        <label for="importDataFile" class="btn btn-secondary btn-file-label">
          <i class="fa-solid fa-cloud-arrow-up"></i> استيراد نسخة محفوظة
        </label>
        <input type="file" id="importDataFile" accept="application/json">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary closeModal">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- Pop-up تأكيد الحذف -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal glass-card modal-sm">
      <h3><i class="fa-solid fa-triangle-exclamation"></i> تأكيد الحذف</h3>
      <p id="confirmText">هل أنت متأكد من الحذف؟</p>
      <div class="modal-actions">
        <button class="btn btn-danger" id="confirmYesBtn">نعم، احذف</button>
        <button class="btn btn-secondary closeModal">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نوتفيقيشن النجاح -->
  <div class="success-toast-overlay" id="successToast">
    <div class="success-toast-card">
      <div class="success-icon-wrapper">
        <svg class="checkmark-svg" viewBox="0 0 52 52">
          <circle class="checkmark-circle" cx="26" cy="26" r="23" fill="none"/>
          <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
      </div>
      <h3 id="toastMessage">تمت الإضافة بنجاح!</h3>
    </div>
  </div>

  <!-- Pop-up الملاحظات -->
  <div id="notesModal" class="notes-modal-overlay">
    <div class="notes-modal-card">
      <div class="neon-accent-bar"></div>
      <button class="btn-close-notes" onclick="closeNotesModal()">&times;</button>
      
      <div class="notes-modal-header">
        <span class="notes-badge">Interactive Note</span>
        <h3 id="notesModalTitle">عنوان الكورس</h3>
      </div>

      <div class="notes-modal-body">
        <textarea id="notesTextarea" placeholder="اكتب ملاحظاتك هنا..."></textarea>
      </div>

      <div class="notes-modal-footer">
        <button onclick="deleteCurrentNote()" class="btn-neon-delete">
          <i class="fa-solid fa-trash-can"></i> مسح الملاحظة
        </button>
        <div class="footer-right-actions">
          <button onclick="copyNotesText()" class="btn-neon-action">
            <i class="fa-regular fa-copy"></i> نسخ
          </button>
          <button onclick="saveCurrentNote()" class="btn-neon-save">
            <i class="fa-solid fa-floppy-disk"></i> حفظ التعديل
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
